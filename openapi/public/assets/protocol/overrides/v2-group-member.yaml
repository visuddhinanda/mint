# 手写补充：v2 团队成员已被 v3 取代（2026-11-13）。
get:
  deprecated: true
  description: |
    `view=user` 已被 `GET /v3/me/groups` 取代，`view=group` 已被 `GET /v3/groups/{group}/members` 取代。
    保留仅为 dashboard-v4 兼容，待 v4 下线后删除。
post:
  deprecated: true
  description: |
    已被 `POST /v3/groups/{group}/members` 取代（v3 可指定角色，默认 reader）。
    2026-11-13 起要求调用者是该团队的 owner / manager。保留仅为 dashboard-v4 兼容，待 v4 下线后删除。
