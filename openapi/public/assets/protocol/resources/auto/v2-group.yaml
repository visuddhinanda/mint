get:
  summary: '列出 group'
  tags:
    - group
  operationId: get_api_v2_group
  description: |
    `view=all` 已被 `GET /v3/groups?search=`（只搜公开团队）取代；
    `view=studio`（含 `view2`）已被 `GET /v3/me/groups?owned=true|false` 取代。
    保留仅为 dashboard-v4 兼容，待 v4 下线后删除。
  parameters:
    -
      name: view
      in: query
      schema:
        type: string
        enum:
          - studio
          - all
    -
      name: name
      in: query
      schema:
        type: string
    -
      name: view2
      in: query
      schema:
        type: string
        default: my
    -
      name: search
      in: query
      schema:
        type: string
    -
      name: order
      in: query
      schema:
        type: string
        default: updated_at
    -
      name: dir
      in: query
      schema:
        type: string
        default: desc
    -
      name: offset
      in: query
      schema:
        type: string
    -
      name: limit
      in: query
      schema:
        type: string
  responses:
    200:
      description: '成功。业务失败时 HTTP 仍可能为 200，以 ok 字段为准。'
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              message:
                type: string
              data:
                type: object
                properties:
                  rows:
                    type: array
                    items:
                      type: object
                      properties: { uid: { type: string }, name: { type: string }, description: { type: string }, owner: { type: string }, studio: { type: string }, updated_at: { type: string }, created_at: { type: string }, role: { type: string } }
                  count:
                    type: integer
    401:
      $ref: '../../main.yaml#/components/responses/Unauthorized'
    422:
      $ref: '../../main.yaml#/components/responses/ValidationError'
  deprecated: true
post:
  summary: '新建 group'
  tags:
    - group
  operationId: post_api_v2_group
  description: |
    已被 `POST /v3/groups` 取代。保留仅为 dashboard-v4 兼容，待 v4 下线后删除。
  requestBody:
    required: false
    content:
      application/json:
        schema:
          type: object
          properties:
            studio_name:
              type: string
            name:
              type: string
  responses:
    200:
      description: '成功。业务失败时 HTTP 仍可能为 200，以 ok 字段为准。'
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              message:
                type: string
              data:
                type: object
    401:
      $ref: '../../main.yaml#/components/responses/Unauthorized'
    422:
      $ref: '../../main.yaml#/components/responses/ValidationError'
  deprecated: true
