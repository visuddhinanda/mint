<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>巴利三藏工作分配组织图</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f3ec; --paper:#fffdf8; --ink:#2a2622; --muted:#7a7166; --line:#d9d1c3;
    --saffron:#c4761c; --saffron-soft:#f3e2c7; --blue:#3f5f78; --blue-soft:#dfe8ef;
    --hit:#fff1a8;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1b1916; --paper:#24211d; --ink:#ece6dc; --muted:#a39a8d; --line:#3d3830;
      --saffron:#e39a45; --saffron-soft:#3b2d1c; --blue:#8fb1cc; --blue-soft:#24313b; --hit:#5a4d12; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans SC",system-ui,sans-serif;font-size:14px;line-height:1.5}
  header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 20px 12px}
  .hrow{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;max-width:1200px;margin:0 auto}
  h1{font-family:"Noto Serif SC",serif;font-size:20px;margin:0;font-weight:700;letter-spacing:.02em}
  .stats{color:var(--muted);font-size:13px}
  .spacer{flex:1}
  input.search{width:240px;max-width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:inherit}
  button{font:inherit;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
  button:hover{border-color:var(--saffron)}
  button.primary{background:var(--saffron);border-color:var(--saffron);color:#fff}
  main{max-width:1200px;margin:0 auto;padding:18px 20px 60px}
  .tree ul{list-style:none;margin:0;padding-left:26px;position:relative}
  .tree li{position:relative;margin:8px 0}
  .tree ul > li::before{content:"";position:absolute;left:-16px;top:0;bottom:-8px;border-left:1px solid var(--line)}
  .tree ul > li:last-child::before{bottom:auto;height:22px}
  .tree ul > li::after{content:"";position:absolute;left:-16px;top:22px;width:14px;border-top:1px solid var(--line)}
  .node{display:inline-flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper)}
  .node .tg{width:22px;height:22px;padding:0;border:none;background:none;color:var(--muted);font-size:12px;cursor:pointer}
  .node .t{font-weight:700}
  .lvl0 > .node{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .lvl0 > .node .tg{color:var(--bg)}
  .lvl1 > .node{background:var(--saffron-soft);border-color:var(--saffron)}
  .lvl2 > .node{background:var(--blue-soft);border-color:var(--blue)}
  .cnt{font-size:12px;color:var(--muted);font-weight:400}
  .lvl0 > .node .cnt{color:inherit;opacity:.7}
  input.name{width:120px;padding:3px 8px;border:1px dashed var(--muted);border-radius:6px;background:transparent;color:inherit;font:inherit;font-size:13px}
  input.name:focus{outline:none;border-style:solid;border-color:var(--saffron)}
  input.name::placeholder{color:inherit;opacity:.55}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;padding:8px 0 4px 26px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .card .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .key{font-size:11px;font-family:ui-monospace,monospace;color:var(--muted);background:var(--bg);padding:1px 6px;border-radius:4px}
  .card ol{margin:0;padding-left:0;list-style:none}
  .card li{font-size:13px;padding:2px 0;border-top:1px dotted var(--line);overflow-wrap:anywhere}
  .card li:first-child{border-top:none}
  mark{background:var(--hit);color:inherit;border-radius:2px}
  .hidden{display:none !important}
  .collapsed > ul, .collapsed > .cards{display:none}
  .note{color:var(--muted);font-size:12px;margin:6px 0 0}
  dialog{border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);width:min(760px,92vw);padding:16px}
  dialog textarea{width:100%;height:50vh;font-family:ui-monospace,monospace;font-size:12px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
  .drow{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;align-items:center}
  .toast{color:var(--saffron);font-size:13px;margin-right:auto}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>巴利三藏工作分配组织图</h1>
    <span class="stats" id="stats"></span>
    <span class="spacer"></span>
    <input class="search" id="q" type="search" placeholder="搜索作品或分组键，如 Jātaka、mn1">
    <button id="expand">全部展开</button>
    <button id="collapse">折叠到各部</button>
    <button class="primary" id="mm">导出 Mermaid</button>
  </div>
  <p class="note hrow">在每个框里直接填负责人姓名。姓名只保存在你这台浏览器里；要保存或分享，请用"导出 Mermaid"复制出来。</p>
</header>
<main><div class="tree" id="tree"></div></main>

<dialog id="dlg">
  <strong>Mermaid 代码（含已填写的负责人）</strong>
  <textarea id="mmtext" readonly></textarea>
  <div class="drow"><span class="toast" id="toast"></span><button id="copy" class="primary">复制</button><button id="close">关闭</button></div>
</dialog>

const STORE = 'tipitaka-org-names-v1';
let names = {};
try { names = JSON.parse(localStorage.getItem(STORE) || '{}') || {}; } catch(e) { names = {}; }
function save(){ try { localStorage.setItem(STORE, JSON.stringify(names)); } catch(e) {} }

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function countWorks(n){ return n.works ? n.works.length : n.children.reduce((a,c)=>a+countWorks(c),0); }
function countPersons(n){ return n.works ? 1 : 1 + n.children.reduce((a,c)=>a+countPersons(c),0); }

function nameInput(id){
  return `<input class="name" data-id="${id}" placeholder="负责人：待定" value="${esc(names[id]||'')}">`;
}

function render(n, lvl){
  const isGroupOfCards = n.children.every(c => c.works);
  let h = `<li class="lvl${lvl}" data-node="${n.id}"><span class="node">
    <button class="tg" aria-label="展开/折叠">▾</button>
    <span class="t">${esc(n.title)}</span>${nameInput(n.id)}
    <span class="cnt">${countWorks(n)} 部</span></span>`;
  if (isGroupOfCards){
    h += `<div class="cards">` + n.children.map(card).join('') + `</div>`;
  } else {
    h += `<ul>` + n.children.map(c => render(c, lvl+1)).join('') + `</ul>`;
  }
  return h + `</li>`;
}
function card(p){
  return `<div class="card" data-card="${p.id}"><div class="top">${nameInput(p.id)}
    ${p.key ? `<span class="key">${esc(p.key)}</span>` : ''}</div>
    <ol>${p.works.map(w => `<li data-w="${esc(w)}">${esc(w)}</li>`).join('')}</ol></div>`;
}

const treeEl = document.getElementById('tree');
treeEl.innerHTML = `<ul style="padding-left:0">${render(DATA,0)}</ul>`;
document.getElementById('stats').textContent =
  `${countWorks(DATA)} 部作品 · ${DATA.children.flatMap(function f(n){return n.works?[n]:n.children.flatMap(f)}).length} 位册级负责人 · 共 ${countPersons(DATA)} 个岗位`;

treeEl.addEventListener('click', e => {
  const b = e.target.closest('.tg'); if (!b) return;
  const li = b.closest('li'); li.classList.toggle('collapsed');
  b.textContent = li.classList.contains('collapsed') ? '▸' : '▾';
});
treeEl.addEventListener('input', e => {
  if (!e.target.matches('input.name')) return;
  const v = e.target.value.trim();
  if (v) names[e.target.dataset.id] = v; else delete names[e.target.dataset.id];
  save();
});

function setCollapsed(li, c){ li.classList.toggle('collapsed', c); const b = li.querySelector(':scope > .node .tg'); if (b) b.textContent = c ? '▸' : '▾'; }
document.getElementById('expand').onclick = () => treeEl.querySelectorAll('li').forEach(li => setCollapsed(li,false));
document.getElementById('collapse').onclick = () => treeEl.querySelectorAll('li').forEach(li => {
  setCollapsed(li, li.querySelector(':scope > .cards') !== null);
});

// search
// strip diacritics char-by-char so positions stay aligned (ā→a, ṭ→t, ñ→n …)
const fold = s => Array.from(s.toLowerCase()).map(c => c.normalize('NFD')[0]).join('');
document.getElementById('q').addEventListener('input', e => {
  const q = fold(e.target.value.trim());
  treeEl.querySelectorAll('.card').forEach(c => {
    const key = (c.querySelector('.key')?.textContent || '').toLowerCase();
    let any = !q || key.includes(q);
    c.querySelectorAll('li').forEach(li => {
      const w = li.dataset.w; const i = fold(w).indexOf(q);
      if (q && i >= 0){ any = true; li.innerHTML = esc(w.slice(0,i)) + '<mark>' + esc(w.slice(i,i+q.length)) + '</mark>' + esc(w.slice(i+q.length)); }
      else li.innerHTML = esc(w);
    });
    c.classList.toggle('hidden', !any);
  });
  treeEl.querySelectorAll('li[data-node]').forEach(li => {
    const vis = li.querySelectorAll('.card:not(.hidden)').length > 0;
    li.classList.toggle('hidden', !!q && !vis);
    if (q && vis) setCollapsed(li, false);
  });
});

// mermaid export
function mermaid(){
  const L = ['flowchart LR',
    '  classDef top fill:#2b2b2b,color:#fff,stroke:#000',
    '  classDef pitaka fill:#f4d58d,stroke:#b8860b,color:#000',
    '  classDef mgr fill:#bcd4e6,stroke:#4a6f8a,color:#000',
    '  classDef person fill:#fff,stroke:#888,color:#000'];
  const q = s => s.replace(/"/g,'#quot;');
  const sid = id => 'n_' + id.replace(/\W/g,'_');
  const who = id => q(names[id] || '待定');
  (function walk(n, lvl, parent){
    const cls = n.works ? 'person' : ['top','pitaka','mgr'][lvl] || 'mgr';
    let label;
    if (n.works) label = `<b>负责人：${who(n.id)}</b>${n.key?` [${n.key}]`:''}<br/>` + n.works.map(w=>'· '+q(w)).join('<br/>');
    else label = `负责人：${who(n.id)}<br/><b>${q(n.title)}</b>`;
    L.push(`  ${sid(n.id)}["${label}"]:::${cls}`);
    if (parent) L.push(`  ${parent} --> ${sid(n.id)}`);
    (n.children||[]).forEach(c => walk(c, lvl+1, sid(n.id)));
  })(DATA, 0, null);
  return L.join('\n');
}
const dlg = document.getElementById('dlg'), ta = document.getElementById('mmtext'), toast = document.getElementById('toast');
document.getElementById('mm').onclick = () => { ta.value = mermaid(); toast.textContent=''; dlg.showModal(); };
document.getElementById('close').onclick = () => dlg.close();
document.getElementById('copy').onclick = async () => {
  try { await navigator.clipboard.writeText(ta.value); toast.textContent = '已复制'; }
  catch(e){ ta.focus(); ta.select(); toast.textContent = '浏览器不允许自动复制，已全选，请按 Ctrl/⌘+C'; }
};
